{% extends "base.html" %} {% block title %}Dictionary Mapping{% endblock %} {% block content%}
    <div class="page-container">
        <h3>Dictionary Mapping</h3>
        <br />

        <div id="project-selector">
            <label for="project-dropdown"><strong>Project:</strong></label>
            <select id="project-dropdown">
                <option value="">-- Select a project --</option>
            </select>
        </div>

        <br />
        <div id="handsontable-container"></div>
        <br />
        <button id="save-button" class="btn btn-primary" disabled>Save changes</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.6.0/dist/handsontable.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.0/dist/handsontable.full.min.css">

    <script>
        const saveButton = document.getElementById('save-button');
        const projectDropdown = document.getElementById('project-dropdown');
        let handsOnTable;

        const colHeaders = ["Column", "Attribute", "Attribute Of", "Entity", "Unit", "Format",
                             "Property", "Time", "Relation", "In Relation To", "Label", "Role",
                             "Definition", "Comment", "Was Derived From", "Was Generated By"];

        fetch('/projects').then(resp => resp.json())
        .then(data => {
            data.forEach(it => {
                const option = document.createElement('option');
                option.value = it.project_name;
                option.textContent = it.project_name;
                projectDropdown.appendChild(option);
            });
            initializeTable(getEmptyData());
        }).catch(e => console.log("erro:", e));

        projectDropdown.addEventListener('change', function() {
            const selectedProject = this.value;
            if (selectedProject) {
                loadProject(selectedProject);
            } else {
                initializeTable(getEmptyData());
            }
        });

        function getEmptyData() {
            return [Array(colHeaders.length).fill("")];
        }

        async function initializeTable(data) {
            const container = document.getElementById('handsontable-container');
            if (handsOnTable) handsOnTable.destroy();

            handsOnTable = new Handsontable(container, {
                data: data,
                colHeaders: colHeaders,
                rowHeaders: true,
                columns: colHeaders.map(() => ({ type: 'text' })),
                minSpareRows: 1,
                themeName: 'ht-theme-main',
                licenseKey: 'non-commercial-and-evaluation'
            });
            saveButton.disabled = false;
        }

        function loadProject(project) {
            fetch(`/loadDictionaryMapping/${encodeURIComponent(project)}`)
            .then(resp => resp.json())
            .then(data => {
                if (data.length > 0) {
                    initializeTable(data);
                } else {
                    initializeTable(getEmptyData());
                }
            }).catch(e => console.error('Error loading Dictionary Mapping:', e));
        }

        saveButton.addEventListener('click', () => {
            const projectChosen = projectDropdown.value;

            if (!projectChosen) {
                window.location.href = '/dictionarymapping?error=' + encodeURIComponent("Choose a project before saving!");
                return;
            }

            const dataInserted = handsOnTable.getData();

            fetch(`/saveDictionaryMapping/${encodeURIComponent(projectChosen)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: dataInserted })
            }).then(resp => resp.json())
            .then(result => {
                if (result.status === 'ok') {
                    window.location.href = '/dictionarymapping?success=' + encodeURIComponent(result.message);
                } else {
                    window.location.href = '/dictionarymapping?error=' + encodeURIComponent(result.message);
                }
            }).catch(e => window.location.href = '/dictionarymapping?error=' + encodeURIComponent("Unexpected error while saving."));
        });
    </script>

    <style>
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #project-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #project-dropdown {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            min-width: 200px;
        }

        #handsontable-container {
            margin: 0 auto;
            width: 85%;
        }
    </style>
{% endblock %}
